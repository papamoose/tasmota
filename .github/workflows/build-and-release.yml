name: Track Tasmota releases and build Prometheus-enabled firmware

on:
  schedule:
    # Check for a new upstream Tasmota release once a day.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      build_envs:
        description: 'Comma-separated PlatformIO envs to build (leave blank for the default set)'
        required: false
        default: ''
      force_rebuild:
        description: 'Rebuild even if a release for the latest upstream tag already exists (uploads/overwrites assets on it)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tasmota-prometheus-build
  cancel-in-progress: false

env:
  UPSTREAM_REPO: arendst/Tasmota
  # Comma-separated list of PlatformIO environments to build, once per
  # time zone. Add/remove envs from tasmota/platformio.ini as needed.
  # tasmota-minimal is the stripped-down build (build_flags
  # -DFIRMWARE_MINIMAL) for flash-constrained boards - small enough to
  # flash directly, then OTA up to a full build afterward.
  #
  # Default set used for scheduled runs, and for manual runs where the
  # build_envs input is left blank.
  BUILD_ENVS: ${{ github.event.inputs.build_envs != '' && github.event.inputs.build_envs || 'tasmota,tasmota-minimal' }}
  # PlatformIO Core 6.2.0 has an open regression where pioarduino-based
  # platforms get their tool-scons package wiped mid-build, causing:
  #   ModuleNotFoundError: No module named 'SCons.Tool.FortranCommon'
  # See: https://github.com/pioarduino/platform-espressif32/issues/529
  # Pinning to the last known-good release until that's fixed upstream.
  PLATFORMIO_VERSION: "6.1.19"

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.upstream.outputs.tag }}
      rebuild_needed: ${{ steps.check.outputs.rebuild_needed }}
      release_exists: ${{ steps.check.outputs.release_exists }}
    steps:
      - name: Get latest upstream release tag
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq '.tag_name')
          echo "Latest upstream Tasmota release: $latest"
          echo "tag=$latest" >> "$GITHUB_OUTPUT"

      - name: Check whether this tag was already built
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${{ steps.upstream.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if [ "${{ github.event.inputs.force_rebuild }}" = "true" ]; then
              echo "Release ${{ steps.upstream.outputs.tag }} exists, but force_rebuild=true - rebuilding anyway."
              echo "rebuild_needed=true" >> "$GITHUB_OUTPUT"
            else
              echo "Already built ${{ steps.upstream.outputs.tag }}, nothing to do."
              echo "rebuild_needed=false" >> "$GITHUB_OUTPUT"
            fi
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "New release detected: ${{ steps.upstream.outputs.tag }}"
            echo "rebuild_needed=true" >> "$GITHUB_OUTPUT"
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

  create-release:
    needs: check
    if: needs.check.outputs.rebuild_needed == 'true' && needs.check.outputs.release_exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Create release (the build jobs upload the binaries)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ needs.check.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "Tasmota ${{ needs.check.outputs.tag }} + Prometheus" \
            --notes "Unofficial rebuild of [Tasmota ${{ needs.check.outputs.tag }}](https://github.com/${{ env.UPSTREAM_REPO }}/releases/tag/${{ needs.check.outputs.tag }}) with \`USE_PROMETHEUS\` enabled (adds the \`/metrics\` HTTP endpoint). Each environment is built once per US time zone - Eastern, Central, Mountain, Pacific - with that zone's NTP, timezone, and DST defaults baked in. Binaries are labeled with the zone name (e.g. \`tasmota-eastern.bin\`); the zone only changes the time defaults. Built environments: ${BUILD_ENVS}."

  build:
    needs: [check, create-release]
    # !cancelled() lifts the implicit success() gate: without a status
    # function here, a skipped create-release (existing release +
    # force_rebuild) would skip this job before the if is evaluated.
    # Run when check succeeded, a rebuild is needed, and create-release
    # either made a new release or was correctly skipped.
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.check.outputs.rebuild_needed == 'true' && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One job per US time zone. Each job builds every env from
        # BUILD_ENVS with that zone's override
        # (config/user_config_override_<zone>.h) and labels the output
        # binaries with the zone name (e.g. tasmota-eastern.bin).
        zone: [eastern, central, mountain, pacific]
    steps:
      - name: Checkout this repo (for override config)
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout Tasmota at upstream tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.check.outputs.tag }}
          path: tasmota

      - name: Apply Prometheus + timezone override config
        run: |
          set -euo pipefail
          cp builder/config/user_config_override_base.h tasmota/tasmota/user_config_override_base.h
          cp builder/config/user_config_override_${{ matrix.zone }}.h tasmota/tasmota/user_config_override.h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install "platformio==${PLATFORMIO_VERSION}"

      - name: Build firmware
        working-directory: tasmota
        run: |
          set -euo pipefail
          IFS=',' read -ra ENVS <<< "${BUILD_ENVS}"
          for e in "${ENVS[@]}"; do
            echo "::group::Building $e (${{ matrix.zone }})"
            pio run -e "$e"
            echo "::endgroup::"
          done

      - name: Collect and label binaries
        run: |
          set -euo pipefail
          Z="${{ matrix.zone }}"
          mkdir -p out
          IFS=',' read -ra ENVS <<< "${BUILD_ENVS}"
          for e in "${ENVS[@]}"; do
            for f in "tasmota/build_output/firmware/$e.bin" "tasmota/build_output/firmware/$e.bin.gz"; do
              if [ -f "$f" ]; then
                case "$f" in
                  *.gz) cp "$f" "out/${e}-${Z}.bin.gz" ;;
                  *)    cp "$f" "out/${e}-${Z}.bin" ;;
                esac
              fi
            done
          done
          ls -la out

      - name: Upload binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ needs.check.outputs.tag }}" out/* \
            --repo "${{ github.repository }}" \
            --clobber
